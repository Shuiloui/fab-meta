# Vérifie une pull request : tests (dont la validité de data/resultats.csv)
# et construction du site, sans rien publier. Le site construit est
# téléchargeable dans l'onglet "Summary" du run (artefact "apercu-site").
name: Vérifier

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover tests
      - name: Construire le site
        run: python scripts/build_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: apercu-site
          path: site
